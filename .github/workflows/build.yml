# Builds a signed APK on every code push and publishes it as a GitHub release.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - "config.json"
      - "README.md"
      - "provisioning/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bundle default config into the app
        run: |
          mkdir -p app/src/main/assets
          cp config.json app/src/main/assets/config.json

      - name: Unlock signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set in repo settings"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/keystore.p12.enc -out "$RUNNER_TEMP/ks.p12" -pass env:KEYSTORE_PASSWORD

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ks.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease :door:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Check signature matches the provisioning QR
        run: |
          cp app/build/outputs/apk/release/app-release.apk fold-control.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs fold-control.apk | tee certs.txt
          HEX=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          SUM=$(echo -n "$HEX" | xxd -r -p | openssl base64 | tr -d '=' | tr '/+' '_-')
          echo "Signature checksum: $SUM"
          test "$SUM" = "$(cat signing/signature-checksum.txt)"

      - name: Collect Door Control APK
        run: cp door/build/outputs/apk/release/door-release.apk door-control.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fold Control v${{ github.run_number }}
          files: |
            fold-control.apk
            door-control.apk
          make_latest: true
